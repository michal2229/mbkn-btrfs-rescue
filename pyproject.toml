[project]
name = "mbkn-btrfs-rescue"
version = "0.4.0"
description = "Read-only btrfs recovery: scan a device for tree blocks, index them in SQLite, browse and restore files"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "crc32c>=2.7",
    "dissect-btrfs>=1.10",
    "numpy>=2.2",
    "xxhash>=3.5",
]

[project.optional-dependencies]
fuse = ["mfusepy>=3.0"]

[project.scripts]
mbkn-btrfs-rescue = "mbkn_btrfs_rescue.cli:main"

[dependency-groups]
dev = [
    "codespell>=2.4.3",
    "mypy>=2.3.1",
    "pytest>=8.3",
    "ruff>=0.12",
    "shellcheck-py>=0.11.0.1",
]

[build-system]
requires = ["uv_build>=0.8,<1"]
build-backend = "uv_build"

[tool.uv]
default-groups = ["dev"]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.mypy]
python_version = "3.14"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true

[tool.codespell]
skip = "*.lock,*.sqlite,*.npy,.git,.venv"
ignore-words-list = "ot,fo"
